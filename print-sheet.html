<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRobot — Word / Icon Print Sheet</title>
<style>
  :root{
    --cols: 5;
    --rows: 4;
    --cell-w: 1.7in;        /* 5 across fills 8.5in exactly            */
    --cell-h: 2.66667in;    /* 4 down = 10.667in, leaves 1/3in at base  */
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{ font-family: Arial, Helvetica, "Segoe UI", sans-serif; color:#000; }

  .page{
    position:relative;
    width:8.5in;
    height:11in;
    overflow:hidden;
    background:#fff;
    page-break-after: always;
    break-after: page;
  }
  .page:last-of-type{ page-break-after: auto; break-after: auto; }

  .grid{
    display:grid;
    grid-template-columns: repeat(var(--cols), var(--cell-w));
    grid-template-rows: repeat(var(--rows), var(--cell-h));
    width:8.5in;
  }
  .cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .cat{
    position:absolute;
    top:0.035in;
    left:0.045in;
    font-size:5.5pt;
    font-weight:bold;
    letter-spacing:.3px;
    color:#777;
    text-transform:uppercase;
  }
  .unit{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0.07in;
  }
  .icon{
    height:0.8in;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .icon svg{ width:0.8in; height:0.8in; display:block; }
  .word{
    width:100%;
    margin-top:0.05in;
    text-align:center;
    font-weight:700;
    line-height:1.0;
    text-transform:uppercase;
  }

  /* shared cut lines drawn as SVG strokes so the driver can't drop them */
  .lines{
    position:absolute;
    top:0;
    left:0;
    width:8.5in;
    height:11in;
  }

  @media screen{
    body{ background:#d8d8d8; padding:0.25in 0; }
    .page{ margin:0 auto 0.25in; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  }
  @media print{
    @page{ size: letter; margin: 0; }
    body{ background:#fff; padding:0; }
    .page{ margin:0; box-shadow:none; }
  }
</style>
</head>
<body>

  bandage: `<rect x="10" y="38" width="80" height="24" rx="12" transform="rotate(-22 50 50)"/><circle cx="46" cy="50" r="3" fill="#000" stroke="none"/><circle cx="54" cy="47" r="3" fill="#000" stroke="none"/><circle cx="40" cy="54" r="3" fill="#000" stroke="none"/><circle cx="60" cy="43" r="3" fill="#000" stroke="none"/>`,

/* ---------- card data: counts straight from README section 12 ---------- */
const CAT_LABEL = {
  blue:     'BLUE',
  orange:   'ORANGE',
  green:    'GREEN',
  yellow:   'YELLOW',
  red:      'RED',
  purple:   'PURPLE',
  compiler: 'COMPILER',
  wildcard: 'JOKER'
};

const CARDS = [
  /* Blue — Action */
  {cat:'blue', word:'MOVE',        icon:'footprint',   count:4},
  {cat:'blue', word:'ROTATE',      icon:'curved_arrow',count:3},
  {cat:'blue', word:'RAISE ARM',   icon:'arm_up',      count:2},
  {cat:'blue', word:'LOWER ARM',   icon:'arm_down',    count:2},
  {cat:'blue', word:'GRASP',       icon:'fist',        count:3},
  {cat:'blue', word:'RELEASE',     icon:'open_hand',   count:3},
  {cat:'blue', word:'POINT',       icon:'point_hand',  count:1},
  {cat:'blue', word:'LOOK',        icon:'eye',         count:1},
  {cat:'blue', word:'BEEP',        icon:'speaker',     count:1},
  {cat:'blue', word:'FREEZE',      icon:'snowflake',   count:1},
  {cat:'blue', word:'SPIN',        icon:'spin',        count:1},
  {cat:'blue', word:'OPEN MOUTH',  icon:'mouth_open',  count:1},
  {cat:'blue', word:'CLOSE EYES',  icon:'eye_closed',  count:1},
  /* Orange — Parameter */
  {cat:'orange', word:'1 STEP',       icon:'dot_one',     count:3},
  {cat:'orange', word:'2 STEPS',      icon:'dot_two',     count:2},
  {cat:'orange', word:'90 DEGREES',   icon:'right_angle', count:2},
  {cat:'orange', word:'180 DEGREES',  icon:'half_turn',   count:1},
  {cat:'orange', word:'LEFT',         icon:'left_arrow',  count:3},
  {cat:'orange', word:'RIGHT',        icon:'right_arrow', count:3},
  {cat:'orange', word:'FORWARD',      icon:'up_arrow',    count:1},
  {cat:'orange', word:'SPEED 50%',    icon:'half_gauge',  count:1},
  /* Green — Target */
  {cat:'green', word:'OBJECT IN FRONT',  icon:'cube',      count:2},
  {cat:'green', word:'NEAREST SURFACE',  icon:'table',     count:2},
  {cat:'green', word:'NEAREST HUMAN',    icon:'person',    count:2},
  {cat:'green', word:'MY OTHER HAND',    icon:'two_hands', count:1},
  {cat:'green', word:'THE GLASS',        icon:'cup',       count:1},
  {cat:'green', word:'THE BALL',         icon:'ball',      count:1},
  {cat:'green', word:'THE BOX',          icon:'box',       count:1},
  /* Yellow — Sensor */
  {cat:'yellow', word:'DISTANCE < 6 INCHES',   icon:'ruler',      count:1},
  {cat:'yellow', word:'TOUCH SENSOR = PRESSED',icon:'tap',        count:1},
  {cat:'yellow', word:'HEAR SOUND = YES',      icon:'ear',        count:1},
  {cat:'yellow', word:'NO OBSTACLE',           icon:'clear_path', count:1},
  /* Red — Glitch */
  {cat:'red', word:'LOW BATTERY',        icon:'battery',      count:1},
  {cat:'red', word:'SENSOR MALFUNCTION', icon:'sensor_x',     count:1},
  {cat:'red', word:'WHEELS SLIP',        icon:'wheel',        count:1},
  {cat:'red', word:'LANGUAGE CORRUPTED', icon:'speech_bubble',count:1},
  {cat:'red', word:'FIRMWARE UPDATE',    icon:'chip',         count:1},
  {cat:'red', word:'DEJA VU',            icon:'rewind',       count:1},
  {cat:'red', word:'OVERHEAT',           icon:'flame',        count:1},
  {cat:'red', word:'SOFTWARE UPDATE',    icon:'gear',         count:1},
  /* Purple — Advanced */
  {cat:'purple', word:'REPEAT 3 TIMES', icon:'loop',    count:2},
  {cat:'purple', word:'REPEAT 2 TIMES', icon:'loop',    count:1},
  {cat:'purple', word:'WHILE [CONDITION]', icon:'diamond', count:1},
  {cat:'purple', word:'IF / THEN',      icon:'branch',  count:1},
  {cat:'purple', word:'ELSE',           icon:'branch',  count:1},
  /* Compiler */

  {cat:'compiler', word:'BUG INJECTION', icon:'bug',     count:2},
  {cat:'compiler', word:'PATCH',         icon:'bandage', count:1},
  {cat:'compiler', word:'ROLLBACK',      icon:'undo',    count:1},
  /* Joker */
  {cat:'wildcard', word:'JOKER', icon:'blank', count:2}
];

/* ---------- layout: 5 x 4 = 20 packed pieces per sheet ---------- */
const COLS = 5, ROWS = 4;
const SHEETS = Math.ceil(
  CARDS.reduce(function(n, c){ return n + c.count; }, 0) / (COLS * ROWS)
);
const CELL_W = 8.5 / COLS;      /* 1.7in    */
const CELL_H = 2.66667;         /* 4 rows = 10.667in, 0.333in spare at the base */
const CUT_W = 0.018;            /* SVG stroke width in inches (~1.3pt) */

const SVG_NS = 'http://www.w3.org/2000/svg';

/* size each word to the real font metrics so nothing spills out of its cell */
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
const FONT_STACK = 'Arial, Helvetica, "Segoe UI", sans-serif';

function textWidth(txt, sizePx){
  measureCtx.font = '700 ' + sizePx + 'px ' + FONT_STACK;
  return measureCtx.measureText(txt).width;
}

const PAD     = 0.07;                                   /* unit padding, in */
const ICON_H  = 0.8;                                    /* icon height, in  */
const AVAIL_W = (CELL_W - 2 * PAD) * 96;                /* px               */
const AVAIL_H = (CELL_H - 2 * PAD - ICON_H - 0.05) * 96;
const MAX_PX  = 34 * 96 / 72;                           /* 34pt cap         */

function lineCount(word, sizePx){
  const tokens = word.split(/\s+/).filter(Boolean);
  const space = textWidth(' ', sizePx);
  let lines = 1, cur = 0;
  for (let i = 0; i < tokens.length; i++){
    const w = textWidth(tokens[i], sizePx);
    if (cur === 0) cur = w;
    else if (cur + space + w <= AVAIL_W) cur += space + w;
    else { lines++; cur = w; }
  }
  return lines;
}

function fitWordSize(word){
  const tokens = word.split(/\s+/).filter(Boolean);
  let maxTok = 0;
  for (let i = 0; i < tokens.length; i++) maxTok = Math.max(maxTok, textWidth(tokens[i], 100));
  let px = Math.min(MAX_PX, 100 * AVAIL_W / maxTok);
  for (let i = 0; i < 60 && px > 12; i++){
    if (lineCount(word, px) * px * 1.02 <= AVAIL_H) break;
    px *= 0.94;
  }
  return Math.max(9, px * 72 / 96);   /* px -> pt */
}

function svg(name, attrs){
  const n = document.createElementNS(SVG_NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function iconSvg(name){
  const s = svg('svg', { viewBox:'0 0 100 100', fill:'none', stroke:'#000',
    'stroke-width':7, 'stroke-linecap':'round', 'stroke-linejoin':'round' });
  s.innerHTML = ICONS[name] || '';
  return s;
}

function make(tag, cls){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  return n;
}

/* expand counts into individual pieces, in README order */
const pieces = [];
CARDS.forEach(function(c){
  for (let i = 0; i < c.count; i++){
    pieces.push({ cat:c.cat, word:c.word, icon:c.icon });
  }
});

function addCutLines(page){
  const s = svg('svg', { viewBox:'0 0 8.5 11', class:'lines' });
  for (let c = 1; c < COLS; c++){
    const x = c * CELL_W;
    s.appendChild(svg('line', { x1:x, y1:0, x2:x, y2:CELL_H * ROWS,
      stroke:'#000', 'stroke-width':CUT_W }));
  }
  for (let r = 1; r <= ROWS; r++){
    const y = r * CELL_H;
    s.appendChild(svg('line', { x1:0, y1:y, x2:8.5, y2:y,
      stroke:'#000', 'stroke-width':CUT_W }));
  }
  page.appendChild(s);
}

for (let p = 0; p < SHEETS; p++){
  const page = make('div', 'page');

  const grid = make('div', 'grid');
  for (let i = 0; i < COLS * ROWS; i++){
    const cell = make('div', 'cell');
    const item = pieces[p * COLS * ROWS + i];
    if (item){
      const label = make('div', 'cat');
      label.textContent = CAT_LABEL[item.cat];
      cell.appendChild(label);

      const unit = make('div', 'unit');

      const icon = make('div', 'icon');
      icon.appendChild(iconSvg(item.icon));
      unit.appendChild(icon);

      const word = make('div', 'word');
      word.textContent = item.word;
      word.style.fontSize = fitWordSize(item.word).toFixed(1) + 'pt';
      unit.appendChild(word);

      cell.appendChild(unit);
    }
    grid.appendChild(cell);
  }
  page.appendChild(grid);

  addCutLines(page);
  document.body.appendChild(page);
}
</script>
</body>
</html>
